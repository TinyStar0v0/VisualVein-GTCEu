plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'visualvein-xaero'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mapping_version}-${forge_version}"

    // Compile-time only. Xaero and GTCEu are provided by the player at runtime.
    compileOnly files("libs/gtceu-1.20.1-${gtceu_version}.jar")
    compileOnly "xaero.map:xaeroworldmap-common-1.20.1:${xaero_world_map_version}"
    compileOnly "xaero.minimap:xaerominimap-common-1.20.1:${xaero_minimap_version}"
    compileOnly "xaero.lib:xaerolib-common-1.20.1:${xaero_lib_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : mapping_version,
            minecraft_version_range: '[1.20.1,1.20.2)',
            forge_version          : forge_version,
            forge_version_range    : '[47.1.0,)',
            loader_version_range   : '[47,)',
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'LGPL-3.0-only',
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            gtceu_version_range    : '[1.4.4,8.0.0)',
            xaero_world_map_range  : '[1.47.0,)',
            xaero_minimap_range    : '[26.6.0,)'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
